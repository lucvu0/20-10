<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>20/10 Vui Vẻ</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Segoe UI", sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background-color:#ffe6ee;
    overflow:hidden;
}

/* Họa tiết dâu */
.strawberry{
    position:absolute;
    font-size:35px;
    opacity:0.25;
}

.s1{top:10%;left:10%;}
.s2{top:20%;right:15%;}
.s3{bottom:15%;left:15%;}
.s4{bottom:10%;right:12%;}
.s5{top:50%;left:5%;}

.container{
    text-align:center;
    z-index:10;
}

button{
    padding:16px 35px;
    border:none;
    border-radius:50px;
    background:#ff8fab;
    color:white;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}

#btn2,#message{
    display:none;
}

#message{
    margin-top:25px;
    background:white;
    padding:25px;
    border-radius:20px;
    width:320px;
    color:#ff5d8f;
    font-size:18px;
    line-height:1.7;
}

.heart{
    position:absolute;
    color:#ff5d8f;
    font-size:25px;
    animation:fly 4s linear infinite;
}

@keyframes fly{
    from{
        transform:translateY(0);
        opacity:1;
    }
    to{
        transform:translateY(-100vh);
        opacity:0;
    }
}
</style>
</head>
<body>

<div class="strawberry s1">🍓</div>
<div class="strawberry s2">🍓</div>
<div class="strawberry s3">🍓</div>
<div class="strawberry s4">🍓</div>
<div class="strawberry s5">🍓</div>

<div class="container">

    <button id="btn1" onclick="showSecond()">
        Bấm vào đây 💌
    </button>

    <button id="btn2" onclick="showWish()">
        Chúc 20/10 vui vẻ 🌷
    </button>

    <div id="message">
        🌸 Chúc Thỏ có một ngày 20/10 thật nhiều niềm vui,
        luôn xinh đẹp, hạnh phúc và gặp thật nhiều điều may mắn.
        Cảm ơn vì đã xuất hiện và làm cuộc sống này đáng yêu hơn. 💕
    </div>

</div>

<script>
function showSecond(){
    document.getElementById("btn1").style.display="none";
    document.getElementById("btn2").style.display="inline-block";
}

function showWish(){
    document.getElementById("btn2").style.display="none";
    document.getElementById("message").style.display="block";

    setInterval(()=>{
        let heart=document.createElement("div");
        heart.className="heart";
        heart.innerHTML="💖";

        heart.style.left=Math.random()*100+"vw";
        heart.style.top="100vh";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },4000);
    },300);
}
</script>

</body>
</html>
